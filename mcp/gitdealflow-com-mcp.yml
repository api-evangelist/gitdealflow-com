- name: share_result
  title: Share This Result (compose tweet/social)
  description: 'Generate a ready-to-share social-media post (tweet, Bluesky, Mastodon, LinkedIn, Telegram) about
    a result the user just received from another VC Deal Flow Signal tool, plus the install command for the MCP
    server. Returns the post body, character counts per platform, and one-click intent URLs to compose the post
    in each network.


    WHEN TO USE:

    - The user just got a `get_trending_startups` / `search_startups_by_sector` / `get_startup_signal` / `get_deep_signal`
    result and says ''share this'', ''tweet this'', ''post this'', or ''how do I tell people about this?''.

    - The user is writing a thread/post about startup engineering signals and wants the canonical install command
    + share copy.


    DO NOT USE FOR:

    - Posting on the user''s behalf, this tool only composes the text + intent URLs. The user must click and confirm
    in the destination network.

    - Generating fake or speculative results, pass real data the agent received from another tool call.


    BEHAVIOR (two-step approval flow, see `approval_token`):

    - Step 1: call this tool with `summary` only. The server replies with an error (-32602) containing a `/share-approve?summary=...`
    URL the user must open.

    - Step 2: the user reads the proposed summary on that page, clicks Approve, and pastes the resulting 10-minute
    token back into the chat. Retry the tool with `approval_token` filled in and the SAME `summary` verbatim.

    - The token is bound to a hash of `summary`; if the agent rewrites the summary between approval and the retry,
    the call is rejected.

    - Composes platform-specific posts (Twitter ≤275 chars, Bluesky ≤295, Mastodon ≤495, LinkedIn ≤695, Telegram
    ≤995) with a consistent hook + insight + install URL.

    - Returns intent URLs (e.g. https://x.com/intent/post?text=...) so the user/agent can open the destination network
    with the post pre-filled.

    - Always includes the canonical install command `npx @gitdealflow/mcp-signal` and the SSRN paper link for credibility.


    PARAMETERS:

    - `summary` (string, required, 10-200 chars), the one-line takeaway to share.

    - `approval_token` (string, required after first call), the 10-minute token returned by the /share-approve page.

    - `network` (string, optional), ''twitter'' | ''bluesky'' | ''mastodon'' | ''linkedin'' | ''telegram'' | ''all''
    (default: ''all'').

    - `mention_handle` (boolean, optional, default false), include @sipiteno attribution (twitter/bluesky/mastodon
    only).'
  input_required:
  - summary
  - approval_token
  input_properties:
  - summary
  - approval_token
  - network
  - mention_handle
  annotations:
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
  paid: false
  source_operation: null
- name: predict_funding
  title: Predict Funding Likelihood (with provenance)
  description: 'Transparent, scored funding-likelihood claim for one tracked startup, with the full evidence chain
    and citable provenance. Instead of an opaque number, returns the score, every component that produced it, a
    confidence level, honest caveats, and links to the methodology + SSRN paper so the derivation can be cited.


    IS a deterministic heuristic over public GitHub engineering-acceleration signals; IS NOT an ML black box, a
    guarantee of any financing event, or based on private/cap-table data. The disclaimer is returned in every response.


    SCORING (also returned in evidence.scoreBreakdown): velocity ≤40 (saturates +300%), contributorGrowth ≤25 (saturates
    +200%), newRepos ≤15 (saturates 10), signalType ≤20 (Deploy frequency spike 20 / Engineering hiring burst 17
    / Infrastructure buildout 14 / Framework migration 8). Total 0-100 → >=70 high, 45-69 elevated, 25-44 moderate,
    <25 low.


    PARAMETERS: { name }, display name or GitHub org slug (case-insensitive). On no match returns { found: false,
    suggestion } (expected, not an error).'
  input_required:
  - name
  input_properties:
  - name
  annotations:
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
  paid: false
  source_operation: openapi/gitdealflow-com-signals-openapi.yml#getScoutPrediction
- name: shortlist_signals
  title: Shortlist Strongest Signals
  description: 'Return a ranked shortlist of the strongest engineering-acceleration signals matching a set of filters,
    the whole sourcing workflow in ONE call (e.g. ''the 5 strongest signals in healthcare in the EU''). Scans the
    full tracked universe, scores each with the transparent engine (same scoring as predict_funding), filters, sorts
    by accelerationScore desc, returns the top `limit`.


    GEOGRAPHY IS REGION-LEVEL ONLY, values are US / EU / UK / APAC / LATAM / Canada / Unknown. City/country aliases
    (''NYC'', ''New York'', ''London'', ''Berlin'', ''Singapore'') normalize up to the enclosing region and the
    response `notes` says so. There is no city-level filtering.


    PARAMETERS (all optional): sector (one of 20 slugs), geography (region token or alias), signalType (exact label),
    minAccelerationScore (0-100), minVelocityChangePct (integer percent), limit (1-25, default 5).'
  input_required: []
  input_properties:
  - sector
  - geography
  - signalType
  - minAccelerationScore
  - minVelocityChangePct
  - limit
  annotations:
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
  paid: false
  source_operation: openapi/gitdealflow-com-signals-openapi.yml#getSignals
- name: compare_signals
  title: Compare Signals Head-to-Head
  description: 'Score and rank 2-5 named startups side by side, returning each one''s acceleration score, evidence,
    and raise-likelihood band plus a single recommendation for which warrants deeper diligence. Same transparent
    scoring as predict_funding / shortlist_signals.


    Names that don''t resolve are returned in `notFound` (expected, not an error). The recommendation is computed
    only over resolved companies; if fewer than 2 resolve it explains that no comparison was possible.


    PARAMETERS: { names: string[] }, 2 to 5 display names or GitHub org slugs (case-insensitive).'
  input_required:
  - names
  input_properties:
  - names
  annotations:
    readOnlyHint: true
    idempotentHint: true
    destructiveHint: false
    openWorldHint: false
  paid: false
  source_operation: openapi/gitdealflow-com-signals-openapi.yml#getSingleSignal
