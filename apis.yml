aid: gitdealflow-com
name: GitDealFlow
description: >-
  GitDealFlow (also published as VC Deal Flow Signal) is a deal-flow signal tool for angel, scout
  and seed investors that reads public GitHub engineering activity across 400+ venture-backed
  startup organizations in 15 sectors and ranks the ones accelerating, historically 3-6 weeks
  before a fundraise announcement. The data is published free under CC BY 4.0 through a no-auth
  REST API described by an OpenAPI 3.1 document, a hosted MCP server (Streamable HTTP plus an npm
  stdio package), an A2A JSON-RPC agent with a published agent card, an NLWeb endpoint, JSON/CSV/
  NDJSON bulk exports and an RSS feed, with one paid deep-signal endpoint metered by credit-pack
  key or x402 USDC micropayments. Operated pseudonymously from Cyprus by "The Data Nerd";
  methodology published on SSRN.
image: https://signals.gitdealflow.com/icon.png
