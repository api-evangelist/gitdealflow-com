apis:
- name: VC Deal Flow Signal API
  description: >-
    Free, no-auth REST API over the weekly startup engineering-acceleration panel: bulk signals
    (JSON/CSV/NDJSON), single-startup lookups, sector rankings, citation-ready Q&A retrieval,
    site search, Scout Score receipts, prediction markets, SVG badges, machine-readable pricing,
    changelog, methodology and glossary, plus versioned /api/v1 aliases. One paid deep-signal
    endpoint is metered per call by credit-pack bearer key or x402 USDC on Base.
