- name: VC Deal Flow Signal MCP Server
  description: >-
    Hosted Model Context Protocol server (protocol 2025-06-18, Streamable HTTP) exposing 12
    read-only tools, 3 resources and 7 prompts over the same signal panel; also shipped as the
    npm stdio package @gitdealflow/mcp-signal. Free tools need no auth; an optional anonymous
    client_credentials token (scope mcp:read) is issued by the provider's own OAuth token endpoint,
    and the single paid tool takes a credit-pack bearer key.
  humanURL: https://signals.gitdealflow.com/agents
  image: https://signals.gitdealflow.com/icon.png
  baseURL: https://signals.gitdealflow.com/api/mcp/rpc
