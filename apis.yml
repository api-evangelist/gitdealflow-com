    url: https://signals.gitdealflow.com/agents.md
- name: GitDealFlow NLWeb Endpoint
  description: >-
    Microsoft NLWeb-compatible conversational endpoint: POST a natural-language query and receive
    schema.org-typed JSON-LD (ItemList, Organization, Article, Dataset or WebPage). GET returns the
    request-schema descriptor with example queries.
  humanURL: https://signals.gitdealflow.com/agents.md
  image: https://signals.gitdealflow.com/icon.png
  baseURL: https://signals.gitdealflow.com/api/nlweb
