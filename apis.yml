    url: https://signals.gitdealflow.com/agents.md
  - type: SourceCode
    url: https://github.com/kindrat86/mcp-deal-flow-signal
- name: GitDealFlow A2A Agent
  description: >-
    Agent-to-Agent (A2A 0.3.0) JSON-RPC 2.0 endpoint implementing message/send, tasks/get and
    tasks/cancel over the signal panel, executing synchronously; discovered via the agent card
    served at /.well-known/agent-card.json on both gitdealflow.com and signals.gitdealflow.com.
  humanURL: https://signals.gitdealflow.com/agents
  image: https://signals.gitdealflow.com/icon.png
  baseURL: https://signals.gitdealflow.com/api/a2a
  tags:
