apis:
- name: VC Deal Flow Signal MCP Server
  description: >-
    Hosted Model Context Protocol server (protocol 2025-06-18, Streamable HTTP) exposing 12 read-only
    tools, 3 resources and 7 prompts over the same signal panel; also shipped as the npm stdio package
    @gitdealflow/mcp-signal. Free tools need no auth; an optional anonymous client_credentials token (scope
    mcp:read) is issued by the provider's own OAuth token endpoint, and the single paid tool takes a credit-pack
    bearer key.
  humanURL: https://signals.gitdealflow.com/agents
  image: https://signals.gitdealflow.com/icon.png
  baseURL: https://signals.gitdealflow.com/api/mcp/rpc
  tags:
  - MCP
  - Agents
  - Signals
  properties:
  - type: MCPServer
    url: mcp/gitdealflow-com-mcp.yml
  - type: ToolCrosswalk
    url: mcp/gitdealflow-com-tool-crosswalk.yml
  - type: Documentation
    url: https://signals.gitdealflow.com/agents.md
  - type: SourceCode
    url: https://github.com/kindrat86/mcp-deal-flow-signal
- name: GitDealFlow A2A Agent
  description: >-
    Agent-to-Agent (A2A 0.3.0) JSON-RPC 2.0 endpoint implementing message/send, tasks/get and tasks/cancel
    over the signal panel, executing synchronously; discovered via the agent card served at /.well-known/agent-card.json
    on both gitdealflow.com and signals.gitdealflow.com.
  humanURL: https://signals.gitdealflow.com/agents
  image: https://signals.gitdealflow.com/icon.png
  baseURL: https://signals.gitdealflow.com/api/a2a
  tags:
  - A2A
  - Agents
  properties:
  - type: AgentCard
    url: a2a/gitdealflow-com-a2a.yml
  - type: Documentation
    url: https://signals.gitdealflow.com/agents.md
- name: GitDealFlow NLWeb Endpoint
  description: >-
    Microsoft NLWeb-compatible conversational endpoint: POST a natural-language query and receive schema.org-typed
